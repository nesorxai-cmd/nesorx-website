<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <defs>
    <linearGradient id="nxg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7B2FFF"/>
    </linearGradient>
    <linearGradient id="nxg2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2FFF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background (dark) -->
  <rect width="640" height="160" rx="16" fill="#0A0E1A"/>

  <!-- Icon: hexagonal neural mark -->
  <g transform="translate(24,20)">
    <path d="M60 4 L107 31 L107 85 L60 112 L13 85 L13 31 Z" fill="none" stroke="url(#nxg)" stroke-width="4" filter="url(#glow)"/>
    <!-- N stroke inside hexagon -->
    <path d="M38 82 L38 34 L78 82 L78 34" fill="none" stroke="url(#nxg2)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- neural nodes -->
    <circle cx="38" cy="34" r="4.5" fill="#00D4FF"/>
    <circle cx="78" cy="82" r="4.5" fill="#7B2FFF"/>
    <circle cx="78" cy="34" r="3" fill="#9D6BFF"/>
    <circle cx="38" cy="82" r="3" fill="#33E1FF"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="1">Nesor<tspan fill="url(#nxg)">X</tspan></text>
  <text x="163" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#8FA3C8" letter-spacing="7">INTELLIGENCE. ENGINEERED.</text>
</svg>
